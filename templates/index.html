{% extends 'layout.html' %} {% block content %}
<div class="container">
    {% for row in content %}
<div class="card">
  <img
    class="card-image"
    src="{{ row[6] }}"
    alt="Product image for the {{ row[1] }} {{ row[2] }}."
  />
  <h1 class="card-make">{{ row[1] }}</h1>
  <p class="card-model">{{ row[2] }}</p>
  <p class="card-year">{{ row[3] }}</p>
  <p class="card-about">{{ row[5] }}</p>
  <a class="card-link" href="{{ row[4] }}"
    ><button class="btn">Read More</button></a
  >
</div>
{% endfor %}
</div>
{% endblock %}
